[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libbyctl"
version = "0.1.0"
description = "A planner-first CLI for searching and managing Libby/OverDrive access across library cards"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "libbyctl contributors"}]
keywords = ["libby", "overdrive", "library", "ebook", "audiobook", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "platformdirs>=4,<5",
  "keyring>=25,<27; platform_system != 'Darwin'",
]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
mcp = ["mcp>=2,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "pyright>=1.1,<2",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
libbyctl = "libbyctl.cli.app:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
